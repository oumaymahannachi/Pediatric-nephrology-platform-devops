management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  server:
    port: ${server.port}

spring:
  security:
    user:
      name: user
      password: password
  data:
    mongodb:
      uri: mongodb://mongodb:27017/pedialink

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
