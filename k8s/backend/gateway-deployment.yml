apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pedialink
spec:
  ports:
    - port: 8080
      nodePort: 30080
  selector:
    app: api-gateway
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: pedialink
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: oumaymahannachi/api-gateway:latest
        ports:
          - containerPort: 8080
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-server:8888"
